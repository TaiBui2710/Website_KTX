<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body>

<div class="page-wrapper">
    <div class="page-header">
        <h3>Danh Sách Tài Khoản Hệ Thống (Users)</h3>
    </div>

    <div class="filter-bar">
        <input type="text" class="search-input" placeholder="Tìm theo username, MSSV, họ tên...">
        <select>
            <option value="">-- Lọc theo giới tính --</option>
            <option value="male">Nam (male)</option>
            <option value="female">Nữ (female)</option>
        </select>
        <input type="submit" value="Tìm kiếm" class="btn find-btn">
    </div>

    <div class="table-card">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>MSSV</th>
                    <th>Họ và tên</th>
                    <th>Giới tính</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>2</td>
                    <td><strong>sv001</strong></td>
                    <td>2251010001</td>
                    <td>Nguyễn Văn An</td>
                    <td>Nam</td>
                    <td>an.nv@sv.edu.vn</td>
                    <td>0901000001</td>
                    <td class="action-btns">
                        <button class="btn-sm btn-edit" onclick="openModal('editUserModal')">Sửa</button>
                        <button class="btn-sm btn-delete" onclick="confirm('Xóa tài khoản này?')">Xóa</button>
                    </td>
                </tr>
                <tr>
                    <td>3</td>
                    <td><strong>sv002</strong></td>
                    <td>2251010002</td>
                    <td>Trần Thị Bình</td>
                    <td>Nữ</td>
                    <td>binh.tt@sv.edu.vn</td>
                    <td>0901000002</td>
                    <td class="action-btns">
                        <button class="btn-sm btn-edit" onclick="openModal('editUserModal')">Sửa</button>
                        <button class="btn-sm btn-delete" onclick="confirm('Xóa tài khoản này?')">Xóa</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal-backdrop" id="editUserModal">
    <div class="modal-box">
        <div class="modal-header">
            <h4>Cập Nhật Thông Tin User</h4>
            <button class="btn-close" onclick="closeModal('editUserModal')">✕</button>
        </div>
        <form>
            <div class="form-group">
                <label>Tên đăng nhập (Username)</label>
                <input type="text" class="input-readonly" value="sv001" readonly>
            </div>
            <div class="form-group">
                <label>Mã số sinh viên (student_code)</label>
                <input type="text" value="2251010001">
            </div>
            <div class="form-group">
                <label>Họ và tên (full_name) *</label>
                <input type="text" value="Nguyễn Văn An" required>
            </div>
            <div class="form-group">
                <label>Giới tính (gender)</label>
                <select>
                    <option value="male" selected>Nam (male)</option>
                    <option value="female">Nữ (female)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" value="an.nv@sv.edu.vn" required>
            </div>
            <div class="form-group">
                <label>Số điện thoại (phone)</label>
                <input type="text" value="0901000001">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="closeModal('editUserModal')">Hủy</button>
                <button type="submit" class="btn btn-blue">Lưu thay đổi</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }
</script>

</body>
</html>
