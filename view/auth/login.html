<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Ký Túc Xá Bách Khoa</title>
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <img src="../../assets/images/logo-bk.png" alt="Logo Đại học Bách Khoa">
        <h2>Đăng Nhập Hệ Thống</h2>
        <p>Cổng thông tin Ký túc xá Sinh viên</p>
    </div>

    <form action="../../controller/AuthController.php?action=login" method="POST">
        <div class="auth-group">
            <label for="username">Tên đăng nhập (Username) *</label>
            <input type="text" id="username" name="username" placeholder="VD: sv001 hoặc admin" required>
        </div>

        <div class="auth-group">
            <label for="password">Mật khẩu *</label>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu..." required>
        </div>

        <button type="submit" class="btn btn-blue btn-auth">Đăng nhập</button>
    </form>

    <div class="auth-links">
        <span>Chưa có tài khoản sinh viên? <a href="register.html">Đăng ký ngay</a></span>
        <a href="../guest/index_guest.html" class="back-home">← Quay lại trang chủ (Guest)</a>
    </div>
</div>

</body>
</html>
