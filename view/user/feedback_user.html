<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <section class="section-padding">
        <div class="container" style="max-width: 700px;">
            <h2 class="section-title">Gửi Phản Hồi & Góp Ý</h2>
            <p style="text-align: center; color: var(--text-gray); margin-bottom: 25px;">
                Mọi ý kiến đóng góp về cơ sở vật chất, thái độ phục vụ hoặc thắc mắc về thủ tục xin gửi về Ban Quản Lý.
            </p>

            <form action="#" method="POST" style="background: var(--bg-light); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color);">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: 600; margin-bottom: 5px;">Họ và tên (Không bắt buộc)</label>
                    <input type="text" placeholder="Nhập họ tên của bạn..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: 600; margin-bottom: 5px;">Email hoặc Số điện thoại liên hệ</label>
                    <input type="text" placeholder="Để BQL phản hồi lại cho bạn..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: 600; margin-bottom: 5px;">Nội dung góp ý *</label>
                    <textarea rows="5" required placeholder="Nhập nội dung phản hồi..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                </div>
                <button type="submit" class="btn btn-blue" style="width: 100%;">Gửi Phản Hồi</button>
            </form>
        </div>
    </section>
</body>
</html>
