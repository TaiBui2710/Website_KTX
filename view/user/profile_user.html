<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
    <link rel="stylesheet" href="../../assets/css/user.css">
</head>
<body>

<div class="page-wrapper">
    <div class="page-header">
        <h3>Hồ Sơ Thông Tin Cá Nhân</h3>
    </div>

    <div class="table-card profile-card">
        <form>
            <div class="profile-grid">
                <div class="form-group">
                    <label>Tên đăng nhập (username)</label>
                    <input type="text" class="input-readonly" value="sv001" readonly>
                </div>
                <div class="form-group">
                    <label>Mã số sinh viên (student_code)</label>
                    <input type="text" class="input-readonly" value="2251010001" readonly>
                </div>
                <div class="form-group">
                    <label>Họ và tên (full_name) *</label>
                    <input type="text" value="Nguyễn Văn An" required>
                </div>
                <div class="form-group">
                    <label>Giới tính (gender)</label>
                    <select>
                        <option value="male" selected>Nam (male)</option>
                        <option value="female">Nữ (female)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Email liên hệ (email) *</label>
                    <input type="email" value="an.nv@sv.edu.vn" required>
                </div>
                <div class="form-group">
                    <label>Số điện thoại (phone)</label>
                    <input type="text" value="0901000001">
                </div>
                <div class="form-group col-full">
                    <label>Mật khẩu mới (Bỏ trống nếu không đổi)</label>
                    <input type="password" placeholder="Nhập mật khẩu mới...">
                </div>
            </div>

            <div class="profile-footer-btns">
                <button type="button" class="btn-sm btn-delete" onclick="confirm('Xác nhận xóa tài khoản?')">Xóa tài khoản</button>
                <button type="submit" class="btn btn-blue">Lưu cập nhật</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
